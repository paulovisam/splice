
services:
  db_postgres:
    image: postgres:latest
    container_name: splice_postgres
    ports:
      - "5432:5432"
    networks:
      - splice_network

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: splice
    volumes:
      - $HOME/docker/volumes/splice_postgres:/var/lib/postgresql/data

  redis:
    image: redislabs/redismod
    container_name: splice_redis
    ports:
      - "6379:6379"
    networks:
      - splice_network
  
  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - splice_network
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - $HOME/docker/volumes/splice_mongodb:/data/db

networks:
  splice_network: